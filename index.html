<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press Turn — Prototipo web</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:1.25rem;margin:8px 0}h2{font-size:1.05rem;margin:14px 0 6px}
button{font:inherit;color:#fff;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;background:#4f7cff}
button:disabled{opacity:.35;cursor:not-allowed}
button.sec{background:#3a3f4f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pj{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.pj img.r{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000}
.pj.on{border-color:var(--ac)}
.pj b{display:block;margin-top:4px;font-size:.9rem}
.emo{height:1.1em;vertical-align:-.2em}
.info{background:var(--card);border-radius:12px;padding:10px;margin-top:10px;font-size:.9rem}
.info li{margin:3px 0}
.barra{height:10px;background:#2b3040;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;transition:width .5s}
.hp i{background:var(--ok)}.ult i{background:#f5b301}.hp.bajo i{background:var(--bad)}
.eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lu{background:var(--card);border:2px solid transparent;border-radius:12px;padding:6px;font-size:.78rem;position:relative}
.lu.sel{border-color:var(--ac)}.lu.obj{border-color:var(--bad)}.lu.ali{border-color:var(--ok)}
.lu img.r{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000}
.lu.muerto{opacity:.35;filter:grayscale(1)}
.lu .n{font-weight:700;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .t{color:var(--mut);font-size:.72rem;min-height:1.1em}
.cab{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-weight:700}
.cab.act{color:var(--ac)}
.log{background:var(--card);border-radius:12px;padding:10px;margin:10px 0;white-space:pre-wrap;font-size:.88rem;max-height:210px;overflow:auto}
.hist{color:var(--mut);font-size:.75rem;margin-top:6px}
.panel{background:var(--card);border-radius:12px;padding:10px;margin-top:10px}
.acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acc button{text-align:left;padding:8px;font-size:.82rem;line-height:1.25}
.acc small{display:block;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:5px 10px;font-size:.8rem;background:#3a3f4f}
.chips button.on{background:var(--ac)}
#anim{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;padding:16px;text-align:center}
#anim img{max-width:92vw;max-height:55vh;border-radius:12px}
#anim h3{margin:12px 0 4px}
.vic{text-align:center}.vic img{max-width:100%;max-height:50vh;border-radius:12px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{background:#20242f;color:#fff;border:0;border-radius:8px;padding:8px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top .yo{display:flex;align-items:center;gap:8px}.top .yo img{width:32px;height:32px;border-radius:50%}
.btn-discord{background:#5865f2}.btn-burnice{background:#ff5a1f}
.banner{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:#000}
.burnice{background:var(--card);border-left:4px solid #ff5a1f;border-radius:10px;padding:10px;margin:8px 0;white-space:pre-wrap}
.tienda{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.item{background:var(--card);border-radius:12px;padding:10px;text-align:center}
.item img{height:48px}.item .p{color:#f5b301;font-weight:700;margin:4px 0}
.item button{width:100%;margin-top:4px;padding:6px;font-size:.85rem}
.ficha{background:var(--card2);border-radius:10px;padding:10px;font-size:.85rem;margin-top:8px}
.ficha li{margin:4px 0}
@media(max-width:520px){.acc{grid-template-columns:1fr 1fr}.lu{font-size:.7rem}}
/* pantalla de victoria/derrota: en horizontal, imagen a un lado e info al otro */
@media (orientation:landscape) and (min-width:700px){
  main:has(.vic){max-width:1100px}
  .vic{text-align:left}.vic h1{text-align:center;margin:4px 0 10px}
  .vic-w{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:20px;align-items:start}
  .vic-i{position:sticky;top:8px}
  .vic-i img{width:100%;max-height:calc(100vh - 130px);object-fit:contain}
  .vic-d .reg{max-height:24vh;overflow:auto}
}
@media (orientation:landscape) and (max-height:520px){   /* celular girado: más compacto, botones a la vista */
  main:has(.vic){padding-top:4px}
  .vic h1{font-size:1.05rem;margin:0 0 4px}
  .vic-w{gap:14px}.vic-i{top:4px}
  .vic-i img{max-height:calc(100vh - 84px)}
  .vic-d h2{font-size:.9rem;margin:2px 0 6px}
  .vic-d .reg{display:none}
  .vic-d .info,.vic-d table{font-size:.8rem}
}
</style>
<link rel="stylesheet" href="/estilo.css">
</head>
<body><main id="app"></main>

<div id="anim"></div>
<script src="/musica.js"></script>
<script src="/reproductor.js"></script>
<script src="/interfaz.js"></script>
<script src="/pantallas.js"></script>
<script src="/dialogos.js"></script>
<script src="/novela.js"></script>
<script src="/combate2.js"></script>
<script>
function musica(m){try{window.MUS&&window.MUS.modo(m)}catch(e){}try{window.UI&&UI.fondoDe(m)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(t){
  t=esc(t||'');
  t=t.replace(/&lt;(a?):\w+:(\d+)&gt;/g,(m,a,id)=>`<img class="emo" src="https://cdn.discordapp.com/emojis/${id}.${a?'gif':'png'}?size=48">`);
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\*(.+?)\*/g,'<i>$1</i>');
}
const emo=(p)=>p.emoji_url?`<img class="emo" src="${p.emoji_url}">`:esc(p.emoji||'');
const medios=m=>'🔷'.repeat(m>>1)+'🔹'.repeat(m&1)||'—';
const COL={azul:'#4f7cff',verde:'#3fb56b',rojo:'#d9534f',gris:'#6b7280'};
let PJ=[],elegidos=[],nivel='normal',G=null,S=null,sel=0,tgt=null,tgtAli=null,lock=false,MODO='cpu',SEQ=0,SALA=null,reto=null;
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

async function api(ruta,datos){
  const r=await fetch(ruta,datos?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)}:{});
  return r.json();
}
const dormir=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- cuenta ---------- */
let YO={logueado:false},BZ=null;
async function cargarYo(){try{YO=await api('/api/yo')}catch(e){YO={logueado:false}}}
function barra(extra){
  const cuenta=YO.logueado
   ?`<div class="yo">${UI.av(YO,32)}<span><b>${esc(YO.nombre)}</b> · 💀 ${YO.monedas}</span><a href="/auth/logout" style="color:var(--mut);font-size:.8rem">salir</a></div>`
   :(YO.login_disponible?`<a class="btn-discord" style="padding:8px 12px;border-radius:10px;color:#fff;text-decoration:none" href="/auth/login">Iniciar sesión con Discord</a>`:`<span style="color:var(--mut)">Modo invitado</span>`);
  return `<div class="top">${cuenta}${extra||''}</div>`;
}
const azar=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Bazar de Burnice ---------- */
const CATN={mascotas:['🐾','Mascotas'],marcos:['🖼️','Marcos'],titulos:['🏷️','Títulos'],fondos:['🌄','Fondos'],victorias:['🏆','Victorias'],skins:['👗','Skins']};
function tarjetaTienda(cat,it,modo){
  const of=BZ.oferta&&BZ.oferta.cat===cat&&BZ.oferta.key===it.key;
  let vis='';
  if(cat==='mascotas')vis=it.emoji_url?`<img class="gi" src="${it.emoji_url}">`:'🐾';
  else if(cat==='marcos')vis=`<div class="ring" style="background:${it.css}"><i></i></div>`;
  else if(cat==='titulos')vis=`<div class="tt">«${esc(it.nombre)}»</div>`;
  else vis=it.img?`<div class="foto" style="background-image:url('${esc(it.img)}')"></div>`:'<span style="font-size:1.8rem">🖼️</span>';
  const bd=!it.disponible?'<span class="bd" style="background:#555">Pronto</span>':it.puesta?'<span class="bd ok">Puesto</span>':it.tiene?'<span class="bd ok">Tuyo</span>'
    :of?`<span class="bd">-${BZ.oferta.pct}%</span>`:(it.precio<it.precio_base&&it.precio_base>0)?`<span class="bd">-${Math.round(100-it.precio*100/it.precio_base)}%</span>`:it.precio_base===0?'<span class="bd ok">Gratis</span>':'';
  const precio=it.tiene?'':`<div class="pr">${it.precio_base===0?'Gratis 🎁':(it.precio<it.precio_base?`<s>${it.precio_base}</s>`:'')+it.precio+' 💀'}</div>`;
  const sub=cat==='skins'?`<div style="color:var(--mut);font-size:.74rem">de ${esc((PJ.find(p=>p.key===it.pj)||{}).nombre||it.pj)}</div>`:'';
  let b;
  if(!it.disponible)b=`<button disabled>Próximamente</button>`;
  else if(it.tiene)b=`<button class="${it.puesta?'sec':''}" onclick="equipar('${cat}','${it.key}',${it.puesta},'${it.pj||''}')">${it.puesta?'Quitar':'Ponerme'}</button>`;
  else b=`<button class="btn-burnice" ${YO.logueado?'':'disabled'} onclick="comprar('${cat}','${it.key}')">Comprar</button>`;
  const ver=it.disponible?`<button class="ver" title="Vista previa" onclick="previa('${cat}','${it.key}')">👁️</button>`:'';
  return `<div class="cartx ${modo==='bloq'&&!it.tiene?'bloq':''}">${bd}<div class="vis">${vis}</div><div class="nm">${esc(it.nombre)}</div>${sub}${precio}<div class="bt2">${b}${ver}</div></div>`;
}
function buscarItem(cat,key){return (BZ.cats[cat]||[]).find(x=>x.key===key)}
function previa(cat,key){
  const it=buscarItem(cat,key);if(!it)return;
  const y=Object.assign({},YO);
  let cuerpo='';
  if(cat==='marcos')y.marco=it.css;
  if(cat==='titulos')y.titulo=it.nombre;
  const masc=cat==='mascotas'?it.emoji_url:YO.mascota_url;
  if(['marcos','titulos','mascotas'].includes(cat)){
    cuerpo=`<div class="perfil" style="margin:8px 0">${UI.av(y,52)}<div><div class="nom">${esc(YO.logueado?YO.nombre:'Tu nombre')}</div>${y.titulo?`<div class="tit">«${esc(y.titulo)}»</div>`:''}<div class="sub">💀 ${YO.monedas||0}</div></div>${masc?`<img class="mas" src="${masc}">`:''}</div>`;
  }else if(cat==='fondos'){cuerpo=`<div style="height:200px;border-radius:12px;background:linear-gradient(rgba(10,12,18,.5),rgba(10,12,18,.5)),url('${esc(it.img)}') center/cover;display:flex;align-items:center;justify-content:center;color:#fff">⚔️ Así se vería tu combate</div>`}
  else cuerpo=`<img class="big" src="${esc(it.img)}">`;
  const d=document.createElement('div');d.id='prev';d.onclick=e=>{if(e.target===d||e.target.dataset.x)d.remove()};
  d.innerHTML=`<div class="caja2"><b>👁️ ${esc(it.nombre)}</b>${cuerpo}<button class="sec" data-x="1" style="margin-top:6px;width:100%">Cerrar</button></div>`;
  document.body.appendChild(d);
}
const ANIMO=()=>{
  const A=(window.DIALOGOS&&window.DIALOGOS.ANIMO)||{};if(!YO.logueado)return '';
  const v=YO.victorias||0,dr=YO.derrotas||0,tot=Object.values(YO.vic_pj||{}).reduce((a,b)=>a+b,0);
  let g=null;
  if(YO.monedas>=400)g='ricos';else if(dr>v+2)g='perdedor';else if(tot>=30)g='ganador';else if(tot===0)g='nuevo';
  return g&&A[g]&&A[g].length?'\n\n'+azar(A[g]):'';
};
async function bazar(pantalla,datos){
  musica('bazar');
  if(pantalla==='personaje'){UI.novela(datos.k);return}   // la ficha se quitó: va directo a hablar
  if(!BZ||pantalla==='inicio'){BZ=await api('/api/bazar');await cargarYo();BZ.animo=ANIMO()}
  const t=BZ.textos,im=BZ.imgs;
  const banner=u=>u?`<img class="banner" src="${esc(u)}">`:'';
  const volver=`<button class="sec" onclick="bazar('inicio')">⬅️ Bazar</button>`;
  let h=barra(`<button class="sec" onclick="inicio()">⚔️ Pelear</button>`);
  const of=BZ.oferta&&buscarItem(BZ.oferta.cat,BZ.oferta.key);
  const bofer=of?`<div class="of"><div>🏷️ <b>Oferta del día:</b> ${esc(of.nombre)} (${CATN[BZ.oferta.cat][1]}) <b>-${BZ.oferta.pct}%</b> → ${of.tiene?'ya lo tienes':of.precio+' 💀'}</div><button class="btn-burnice" onclick="bazar('comprar',{tab:'${BZ.oferta.cat}'})">Ver</button></div>`:'';
  if(pantalla==='inicio'){
    BZ.saludo=BZ.saludo||azar(t.saludos);
    h+=`${banner(im.burnice)}<h1>🔥 El Bazar de Burnice</h1><div class="burnice">${fmt(BZ.saludo+(BZ.animo||''))}</div>${bofer}
    <div class="fila"><button class="btn-burnice" onclick="bazar('comprar')">🛒 Comprar</button>
    <button class="btn-burnice" onclick="bazar('cosas')">🎒 Mis cosas</button>
    <button class="btn-burnice" onclick="bazar('mesa')">🪑 La mesa</button>
    <button class="sec" onclick="bazar('salir')">👋 Salir</button></div>`;
  }else if(pantalla==='comprar'||pantalla==='cosas'){
    const tab=(datos&&datos.tab)||BZ.tab||'mascotas';BZ.tab=tab;
    const msg=datos&&datos.msg||t.comprar;
    const tabs=`<div class="tabs">${Object.keys(CATN).map(c=>`<button class="${pantalla==='comprar'&&tab===c?'on':''}" onclick="bazar('comprar',{tab:'${c}'})">${CATN[c][0]} ${CATN[c][1]}</button>`).join('')}</div>`;
    if(pantalla==='comprar'){
      h+=`${banner(im.comprar)}<h1>🛒 Comprar</h1><div class="burnice">${fmt(msg)}</div>
      ${YO.logueado?'':'<div class="info">Inicia sesión con Discord para comprar.</div>'}${bofer}${tabs}
      <div class="vit">${(BZ.cats[tab]||[]).map(it=>tarjetaTienda(tab,it)).join('')}</div>
      <div class="fila" style="margin-top:12px">${volver}</div>`;
    }else{
      let tot=0,mis=0;Object.values(BZ.cats).forEach(l=>l.forEach(x=>{tot++;if(x.tiene)mis++}));
      h+=`<h1>🎒 Mis cosas</h1><div class="col">Colección: <b>${mis}/${tot}</b> · lo gris con 🔒 es lo que te falta (tócalo en Comprar).</div>
      ${Object.keys(CATN).map(c=>`<h2>${CATN[c][0]} ${CATN[c][1]}</h2><div class="vit">${BZ.cats[c].map(it=>tarjetaTienda(c,it,'bloq')).join('')}</div>`).join('')}
      <div class="fila" style="margin-top:12px">${volver}</div>`;
    }
  }else if(pantalla==='mesa'){
    h+=UI.mesa(t,im,volver);
  }else if(pantalla==='niko'){
    const n=datos.n,l=t.niko[n%t.niko.length];
    h+=`${im.niko?`<img class="banner" src="${esc(im.niko)}">`:''}<h1>☀️ Niko</h1><div class="burnice" style="border-color:#ffd700"><b>Niko:</b> ${fmt(l)}</div>
    <div class="fila"><button class="btn-burnice" onclick="bazar('niko',{n:${n+1}})">💬 Hablar</button><button class="sec" onclick="bazar('mesa')">⬅️ Mesa</button></div>`;
  }else if(pantalla==='salir'){
    h+=`${banner(im.burnice)}<div class="burnice">${fmt(azar(t.salidas))}</div><div class="fila"><button onclick="inicio()">⚔️ Ir a pelear</button><button class="sec" onclick="bazar('inicio')">Volver al Bazar</button></div>`;
  }
  $('#app').innerHTML=h;
  if(pantalla==='mesa')UI.mesaInit();
}
async function comprar(cat,k){
  const r=await api('/api/comprar',{cat,key:k});
  BZ=await api('/api/bazar');await cargarYo();BZ.tab=cat;
  if(r.ok)UI.fx();
  bazar('comprar',{tab:cat,msg:r.error||r.msg});
}
async function equipar(cat,k,quitar,pj){
  await api('/api/equipar',{cat,key:quitar?null:k,pj});
  BZ=await api('/api/bazar');await cargarYo();BZ.tab=cat;
  bazar('comprar',{tab:cat,msg:quitar?'Listo, sin eso. Cuando quieras te lo vuelves a poner, cielo.':'¡Te queda genial! Ya lo llevas contigo.'});
}

/* ---------- elegir equipo ---------- */
async function inicio(conPortada){
  musica('menu');
  if(!PJ.length)PJ=(await api('/api/personajes')).personajes;
  await cargarYo();
  MODO='cpu';SEQ=0;SALA=null;
  elegidos=[];
  if(!reto){
    const u=new URLSearchParams(location.search).get('sala')||LS.g('sala_pendiente');
    if(u){const i=await api('/api/pvp/info?codigo='+encodeURIComponent(u));
      if(i.existe&&i.libre&&!i.mia){reto={codigo:u.toUpperCase(),creador:i.creador};if(!YO.logueado)LS.s('sala_pendiente',u)}
      else{LS.s('sala_pendiente',null);if(i.mia)reto=null}
      history.replaceState(null,'','/')}
  }
  const viejo=LS.g('pvp_sala');
  if(viejo&&YO.logueado){const r=await api('/api/pvp/estado?id='+viejo+'&desde=0');
    if(r.sala==='esperando')return mostrarEspera(viejo,location.origin+'/?sala='+viejo);
    if(r.sala==='jugando'&&!r.actual.terminado)return entrarPvP(viejo,r);
    LS.s('pvp_sala',null)}
  if(conPortada&&!reto)UI.portada();else dibujarEleccion();
 }
function dibujarEleccion(foco){
  return UI.eleccion(foco);
  const f=foco&&PJ.find(p=>p.key===foco);
  $('#app').innerHTML=barra(`<button class="btn-burnice" onclick="bazar('inicio')">🔥 Bazar</button>`)+`<h1>⚔️ Press Turn — elige tu equipo de 3</h1>
  <div class="grid">${PJ.map(p=>`<div class="pj ${elegidos.includes(p.key)?'on':''}" onclick="pick('${p.key}')">
    ${p.gif?`<img class="r" src="${p.gif}">`:''}<b>${emo(p)} ${esc(p.nombre)}</b></div>`).join('')}</div>
  ${f?`<div class="info"><b>${emo(f)} ${esc(f.nombre)}</b> · ${f.vida} HP<br>${esc(f.desc)}<ul>${f.movs.map(m=>`<li><b>${esc(m.nombre)}</b> ${esc(m.desc)}</li>`).join('')}</ul></div>`:''}
  <div class="fila" style="margin-top:12px">
    <span>Equipo: <b>${elegidos.length}/3</b></span>
    <select onchange="nivel=this.value"><option value="facil" ${nivel=='facil'?'selected':''}>CPU fácil</option><option value="normal" ${nivel=='normal'?'selected':''}>CPU normal</option><option value="dificil" ${nivel=='dificil'?'selected':''}>CPU difícil</option></select>
    <button ${elegidos.length==3?'':'disabled'} onclick="empezar()">¡A pelear! (CPU)</button>
    ${reto?`<button class="btn-burnice" ${elegidos.length==3&&YO.logueado?'':'disabled'} onclick="unirse()">⚔️ Aceptar el reto de ${esc(reto.creador)}</button>`
      :(YO.logueado?`<button class="btn-discord" ${elegidos.length==3?'':'disabled'} onclick="crearSala()">👥 Retar a un amigo</button>`:'')}</div>
  ${reto?(YO.logueado?`<div class="info">🔥 <b>${esc(reto.creador)}</b> te retó. Elige tu equipo y acepta.</div>`:`<div class="info">🔥 <b>${esc(reto.creador)}</b> te retó. Inicia sesión con Discord para aceptar.</div>`):''}`;
}
function pick(k){
  const i=elegidos.indexOf(k);
  if(i>=0)elegidos.splice(i,1);else if(elegidos.length<3)elegidos.push(k);
  dibujarEleccion(k);
}
async function empezar(){
  const r=await api('/api/nueva',{equipo:elegidos,nivel});
  if(r.error)return alert(r.error);
  G=r.id;S=r.estado;sel=0;tgt=null;tgtAli=null;CBT.reset();
  dibujarCombate();CBT.inicio();
  if(r.pasos.length)await reproducir(r.pasos);
}

/* ---------- PvP por link ---------- */
async function crearSala(){
  const r=await api('/api/pvp/crear',{equipo:elegidos});
  if(r.error)return alert(r.error);
  SALA=r.codigo;LS.s('pvp_sala',r.codigo);
  mostrarEspera(r.codigo,r.link);
}
function mostrarEspera(cod,link){
  SALA=cod;
  $('#app').innerHTML=barra()+`<h1>👥 Reta a un amigo</h1><div class="info">Pásale este link a tu amigo. Cuando entre y elija su equipo, empieza la pelea.<br><br>
   <input id="lnk" readonly value="${esc(link)}" style="width:100%;padding:10px;border-radius:8px;border:0;background:#20242f;color:#fff">
   <div class="fila" style="margin-top:8px"><button onclick="copiar()">📋 Copiar link</button><button class="sec" onclick="cancelarSala()">Cancelar</button></div>
   <div class="hist" style="margin-top:8px">⏳ Esperando al rival… (la sala dura 30 min)</div></div>`;
  esperarRival(cod);
}
function copiar(){const i=$('#lnk');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}}
function cancelarSala(){SALA=null;LS.s('pvp_sala',null);inicio()}
async function esperarRival(cod){
  while(SALA===cod&&MODO==='cpu'){
    await dormir(2000);
    if(SALA!==cod)return;
    const r=await api('/api/pvp/estado?id='+cod+'&desde=0');
    if(r.error){SALA=null;LS.s('pvp_sala',null);alert(r.error);return inicio()}
    if(r.sala==='jugando')return entrarPvP(cod,r);
  }
}
async function unirse(){
  const r=await api('/api/pvp/unirse',{codigo:reto.codigo,equipo:elegidos});
  if(r.error){reto=null;LS.s('sala_pendiente',null);alert(r.error);return inicio()}
  LS.s('sala_pendiente',null);reto=null;LS.s('pvp_sala',r.codigo);entrarPvP(r.codigo,r);
}
function entrarPvP(cod,r){
  MODO='pvp';G=cod;SALA=cod;SEQ=r.seq;S=r.actual;sel=0;tgt=null;tgtAli=null;lock=false;CBT.reset();
  dibujarCombate();CBT.inicio();
}
function aPasos(evs){return evs.filter(e=>e.seq>SEQ).map(e=>{SEQ=Math.max(SEQ,e.seq);return{estado:e.estado,anims:e.anims}})}
setInterval(async()=>{
  if(MODO!=='pvp'||!S||S.terminado||lock)return;
  const r=await api('/api/pvp/estado?id='+G+'&desde='+SEQ);
  if(lock||MODO!=='pvp'||r.error)return;
  const p=aPasos(r.eventos||[]);if(p.length)reproducir(p);
},1500);
async function rendirse(){
  if(lock||!confirm('¿Seguro que quieres rendirte?'))return;lock=true;
  const r=await api('/api/pvp/rendirse',{id:G,desde:SEQ});
  if(r.error){lock=false;return alert(r.error)}
  await reproducir(aPasos(r.eventos));
}

/* ---------- combate ---------- */
function actorActual(){
  const eq=S.equipos[0].luchadores;
  if(S.turno!==0||S.terminado)return null;
  let l=eq[sel];
  if(!l||!l.acciones.length){l=eq.find(x=>x.acciones.length)||null;sel=l?l.i:0}
  return l;
}
function tarjeta(l,lado){
  const cl=['lu'];
  if(!l.vivo)cl.push('muerto');
  if(lado==0&&l.i===sel&&S.turno===0)cl.push('sel');
  if(lado==1&&l.i===tgt&&!tgtAli&&tgtAli!==0)cl.push('obj');
  if(lado==0&&tgtAli===l.i)cl.push('ali');
  if(S.actor===l.i&&l.vivo&&((S.turno===0)===(lado==0)))cl.push('ya');
  const hp=l.forma?l.forma_hp:l.hp,mx=l.forma?90:l.max_hp,pct=Math.max(0,hp/mx*100);
  if(l.vivo&&pct<30)cl.push('critico');
  if(lado==1&&S.turno===0&&!S.terminado&&l.vivo&&!(S.blancos||[]).includes(l.i))cl.push('nob');
  const extra=[];
  if(l.sombras!=null)extra.push('🌑'.repeat(l.sombras));
  if(l.hojas!=null)extra.push('🍃'.repeat(l.hojas));
  if(l.pm!=null&&l.sombras==null)extra.push(l.pm+' PM');
  const nom=l.forma?('👹 '+esc(l.forma)):(emo(l)+' '+esc(l.nombre));
  return `<div class="${cl.join(' ')}" data-l="${lado}" data-i="${l.i}" onclick="clic(${lado},${l.i})">
   <span class="num">${l.i+1}</span>${l.gif?`<img class="r" ${(l.vivo&&!l.forma&&pct<30&&!(lado==0&&YO.skins&&YO.skins[l.key]))?CBT.cara(l.key,'herido',l.gif):`src="${(lado==0&&YO.skins&&YO.skins[l.key])||l.gif}"`}>`:''}
   <div class="n">${nom}</div>
   ${CBT.barra('hp',lado,l.i,pct)}
   <div>${l.vivo?CBT.num(lado,l.i,hp,mx):'💀'}</div>
   ${CBT.barra('ult',lado,l.i,Math.min(100,l.ulti))}
   <div class="t">${l.vivo?extra.join(' '):''} ${l.ulti_lista?'💥':''}</div>
   ${l.vivo?CBT.chips(l):'<div class="efs"></div>'}</div>`;
}
function clic(lado,i){
  if(lock||!S||S.terminado||S.turno!==0)return;
  if(lado==0){
    const l=S.equipos[0].luchadores[i];
    if(l.acciones.length){sel=i;tgtAli=null}
  }else{
    if(!S.blancos.includes(i))return;
    tgt=i;tgtAli=null;
  }
  dibujarCombate();
}
function elegirAli(i){tgtAli=i;dibujarCombate()}
function elegirRival(i){tgt=i;tgtAli=null;dibujarCombate()}
function ordenH(eq,lado){
  const ya=(S.turno===0)===(lado==0)?S.actor:null;
  return `<div class="orden">Orden: ${eq.luchadores.map(l=>`<span class="${!l.vivo?'x':(l.i===ya?'on':'')}">${l.i+1}.º ${esc(l.forma||l.nombre)}</span>`).join(' → ')}</div>`;
}
function dibujarCombate(forzar){
  if(!S)return;
  if(S.terminado&&!forzar){return dibujarFin()}
  musica('pelea');
  if(window.UI2&&UI2.activo())return UI2.dibujar();   // diseño horizontal (prototipo): ?ui=2
  const a=actorActual();
  if(tgt==null||!S.blancos.includes(tgt))tgt=S.objetivo;
  const miTurno=S.turno===0;
  const soporte=a&&a.acciones.some(x=>x.apoyo||x.dual);
  const e0=S.equipos[0],e1=S.equipos[1];
  let h=`<div class="cab ${S.turno===1?'act':''}"><span>${esc(e1.nombre)} ${S.turno===1?'🔔':''}</span><span>${CBT.iconos(1,S.medios[1],S.turno===1)}</span></div>
  ${ordenH(e1,1)}<div class="eq">${e1.luchadores.map(l=>tarjeta(l,1)).join('')}</div>
  ${CBT.registro(S)}
  <div class="cab ${miTurno?'act':''}"><span>${esc(e0.nombre)} ${miTurno?'🔔':''}</span><span>${miTurno?'Iconos: ':''}${CBT.iconos(0,S.medios[0],miTurno)}</span></div>
  ${ordenH(e0,0)}<div class="eq">${e0.luchadores.map(l=>tarjeta(l,0)).join('')}</div>`;
  if(miTurno&&a){
    h+=`<div class="panel"><div>▶ Turno de <b>${emo(a)} ${esc(a.forma||a.nombre)}</b> (${a.i+1}.º) — elige objetivo y acción</div>
    <div class="chips">${S.blancos.map(i=>`<button class="${tgtAli==null&&tgt===i?'on':''}" onclick="elegirRival(${i})">⚔️ ${esc(e1.luchadores[i].forma||e1.luchadores[i].nombre)}</button>`).join('')}
    ${soporte?S.aliados.map(i=>`<button class="${tgtAli===i?'on':''}" onclick="elegirAli(${i})">💚 ${esc(e0.luchadores[i].nombre)}</button>`).join(''):''}</div>
    <div class="acc">${a.acciones.map(x=>botonAcc(a,x)).join('')}
    <button class="sec" onclick="terminar()">⏭️ Terminar turno</button>${MODO==='pvp'?'<button class="sec" onclick="rendirse()">🏳️ Rendirse</button>':''}</div>
    <div class="hist">🔷 = 1 icono · 🔹 = ½ icono. Toca una carta tuya para cambiar de luchador y una rival para atacarla.</div></div>`;
  }
  if(MODO==='pvp'&&!miTurno)h+=`<div class="panel">⏳ Turno de <b>${esc(e1.nombre)}</b>… tienes 150 s en tu turno o pierdes por abandono. <button class="sec" onclick="rendirse()">🏳️ Rendirse</button></div>`;
  $('#app').innerHTML=h;
  CBT.post();
}
function costeTxt(m){return ({1:'½',2:'1',4:'2'})[m]||(m/2)}
function botonAcc(a,x){
  const ic={normal:'⚔️',hab1:'✨',hab2:'💢',defender:'🛡️',ulti:'💥'}[x.k];
  const nom=x.k==='ulti'&&!a.ulti_lista?`ÚLTI ${a.ulti}%`:x.nombre;
  const b=String(a.boton||'');
  const hex=/^#?[0-9a-f]{6}$/i.test(b)?'#'+b.replace('#',''):null;
  const col=x.k==='defender'?'#6b7280':x.k==='ulti'?'#d9534f':COL[b.toLowerCase()]||hex||COL.azul;
  const extra=(x.pm?` · ${x.pm}PM`:'')+(x.sombras?` · ${x.sombras}🌑`:'');
  return `<button style="background:${col};border:2px solid color-mix(in srgb,${col} 45%,#fff)" data-ok="${x.ok?1:0}" ${x.ok&&!lock?'':'disabled'} onclick="hacer('${x.k}')" title="${esc(x.desc)}">${ic} ${esc(nom)}<small>${costeTxt(x.coste)} icono${extra}</small></button>`;
}
async function hacer(k){
  if(lock)return;const a=actorActual();if(!a)return;
  const x=a.acciones.find(y=>y.k===k);
  const apoyo=tgtAli!=null&&(x.apoyo||x.dual);
  lock=true;
  const r=await api(MODO==='pvp'?'/api/pvp/accion':'/api/accion',{id:G,desde:SEQ,actor:a.i,k,objetivo:tgt,aliado:apoyo||x.apoyo?tgtAli:null,apoyo});
  if(r.error){lock=false;alert(r.error);return}
  tgtAli=null;CBT.atk(0,a.i);
  await reproducir(MODO==='pvp'?aPasos(r.eventos):r.pasos);
}
async function terminar(){
  if(lock)return;lock=true;
  const r=await api(MODO==='pvp'?'/api/pvp/terminar':'/api/terminar',{id:G,desde:SEQ});
  if(r.error){lock=false;alert(r.error);return}
  await reproducir(MODO==='pvp'?aPasos(r.eventos):r.pasos);
}
async function reproducir(pasos){
  lock=true;
  for(const p of pasos){
    const prev=S;let cine=false;
    for(const an of p.anims){
      if(!/Cambio de turno/.test(an.titulo))cine=true;
      CBT.cine(an,CBT.quien(prev));
      await CBT.esperar(Math.min(4500,an.seg*1000));
    }
    CBT.cerrar();
    if(!cine)await CBT.antes(prev,p.estado);
    S=p.estado;
    dibujarCombate(true);
    CBT.efectos(prev,S,{trans:p.anims.some(a=>/Cambio de turno/.test(a.titulo))});
    if(S.terminado)await dormir(1900);
    else if(MODO==='cpu'&&S.turno===1)await dormir(1300);
  }
  lock=false;
  if(S.terminado)dibujarCombate();
  else document.querySelectorAll('.acc button[data-ok="1"]').forEach(b=>b.disabled=false);
}
function dibujarFin(){
  musica('fin');
  const gane=S.ganador===0;
  if(MODO==='pvp'){LS.s('pvp_sala',null)}
  const lid=((S.equipos[S.ganador]||{luchadores:[]}).luchadores.find(l=>l.vivo)||{}).key;
  if(!gane&&!S._fx){S._fx=1;CBT.sfx('derrota')}
  if(gane&&!S._fx){S._fx=1;try{UI.fx()}catch(e){}}
  $('#app').innerHTML=`<div class="vic ${gane?'gano':'perdio'}"><h1>${gane?'🏆 ¡Ganaste!':'💀 Perdiste'}</h1>
  <div class="vic-w"><div class="vic-i">
  ${(gane&&YO.victoria_img)?`<img src="${YO.victoria_img}">`:(lid?`<img ${CBT.cara(lid,'victoria',S.victoria_img||'')}>`:(S.victoria_img?`<img src="${S.victoria_img}">`:''))}
  </div><div class="vic-d">
  ${S.recompensa?`<h2>+${S.recompensa} 💀 Monedas del Alma (total ${S.monedas})</h2>`:(gane&&!YO.logueado&&YO.login_disponible?'<div class="info">Inicia sesión con Discord para ganar monedas.</div>':'')}
  ${CBT.resumen(S)}
  <div class="reg" style="padding:6px 10px"><div>${CBT.lineas(S.log)}</div></div>
  <button onclick="inicio()">Otra pelea</button> <button class="btn-burnice" onclick="bazar('inicio')">🔥 Bazar</button></div></div></div>`;
}
inicio(true);
</script></body></html>
